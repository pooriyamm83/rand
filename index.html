<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یه سوال مهم 🥺</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: #ffe6e6; /* رنگ پس‌زمینه صورتی ملایم */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #d63031; }
        .btn {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #d63031; }
    </style>
</head>
<body>
    <div class="container">
        <h1>آخر هفته برای دیت چیکار کنیم؟ 🥰</h1>
        <p>یکی از گزینه‌های زیر رو انتخاب کن:</p>
        <button class="btn" onclick="alert('ایول! پس بریم کافه ☕')">بریم کافه</button>
        <button class="btn" onclick="alert('عالیه! بریم یه فیلم خفن ببینیم 🎬')">فیلم ببینیم</button>
        <button class="btn" onclick="alert('پایه‌ام! بریم پیاده‌روی 🚶‍♀️')">قدم بزنیم</button>
    </div>
</body>
</html>
